<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community - Dark Shadow Pictures</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* EDIT: colours */
:root{--bg:#08090c;--panel:#12141a;--text:#ece8e1;--muted:#9a9ca3;--accent:#b3263b;--line:#262932}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:18px/1.6 'Source Sans 3',Arial,sans-serif}
a{color:inherit;text-decoration:none}
h1,h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:18px 4vw;border-bottom:1px solid var(--line)}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.7rem;letter-spacing:.06em}
nav a{margin-left:24px;padding-bottom:3px;border-bottom:2px solid transparent}
nav a:hover,nav a.active{border-color:var(--accent)}
main{max-width:680px;margin:0 auto;padding:50px 4vw 80px}
h1{font-size:clamp(3rem,10vw,5rem);line-height:1;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:34px}
.post,.composer{background:var(--panel);border-radius:6px;padding:22px;margin-bottom:24px}
.post time{color:var(--muted);font-size:.9rem}
.post p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post img{width:100%;border-radius:4px;margin-top:8px}
.video{position:relative;aspect-ratio:16/9;margin-top:8px;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tools{margin-top:12px;display:flex;gap:14px}
button,.btn{background:none;border:1px solid var(--line);color:var(--text);padding:8px 16px;font:inherit;font-size:.95rem;border-radius:4px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent)}
.composer{display:none;border:1px solid var(--accent)}
.edit-mode .composer{display:block}
.composer textarea,.composer input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px;font:inherit;margin-bottom:10px}
.composer textarea{min-height:110px;resize:vertical}
.composer small{color:var(--muted);display:block;margin-bottom:10px}
.tools button,.bar{display:none}
.edit-mode .tools button{display:inline-block}
.edit-mode .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<header>
  <a class="logo" href="index.html">DARK SHADOW PICTURES</a>
  <nav>
    <a href="index.html">Home</a><a href="articles.html">Articles</a><a href="about.html">About</a>
    <a href="posts.html" class="active">Community</a>
  </nav>
</header>

<main id="app">
  <!-- EDIT: page title and intro text -->
  <h1>Community</h1>
  <p class="sub">News, photos and videos from the Dark Shadow Pictures team.</p>

  <div class="bar">
    <button id="exportBtn">Download posts.json</button>
    <button id="importBtn">Import posts.json</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>

  <!-- Post box: only visible when you open this page with ?edit at the end of the address -->
  <div class="composer" id="composer">
    <textarea id="fText" placeholder="Write something..."></textarea>
    <input id="fImage" placeholder="Image link (optional), e.g. images/photo1.jpg or https://...">
    <input id="fYoutube" placeholder="YouTube link (optional)">
    <small id="editing"></small>
    <button class="primary" id="saveBtn">Post</button>
    <button id="cancelBtn">Clear</button>
  </div>

  <div id="feed"></div>
</main>

<script>
/* ========= HOW IT WORKS =========
 1. Open posts.html?edit  (add ?edit to the address) to see the post box.
 2. Add, edit or delete posts. They are saved in YOUR browser.
 3. Click "Download posts.json" and replace the posts.json file on your website with it.
 4. Everyone who visits posts.html will now see your posts.
================================= */
const KEY='dsp_posts', EDIT=location.search.includes('edit');
let posts=[], editingId=null;
const $=id=>document.getElementById(id);
if(EDIT) document.getElementById('app').classList.add('edit-mode');

const safeUrl=u=>/^(https?:\/\/|images\/|\.\/|\/)/.test(u)?u:'';
function ytId(u){const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:''}
function el(tag,attrs,text){const e=document.createElement(tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;return e}

async function load(){
  let saved=null;
  if(EDIT){try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
  if(saved){posts=saved}
  else{try{posts=await (await fetch('posts.json',{cache:'no-store'})).json()}catch(e){posts=[]}}
  render();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(posts))}catch(e){}}

function render(){
  const feed=$('feed');feed.innerHTML='';
  posts.sort((a,b)=>b.date.localeCompare(a.date));
  if(!posts.length){feed.appendChild(el('p',{class:'empty'},'No posts yet.'));return}
  posts.forEach(p=>{
    const box=el('article',{class:'post'});
    box.appendChild(el('time',{},new Date(p.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})));
    if(p.text)box.appendChild(el('p',{},p.text));
    const img=safeUrl(p.image||'');
    if(img){const i=el('img',{src:img,alt:'Post image',loading:'lazy'});box.appendChild(i)}
    const id=ytId(p.youtube||'');
    if(id){const v=el('div',{class:'video'});v.appendChild(el('iframe',{src:'https://www.youtube.com/embed/'+id,title:'YouTube video',allowfullscreen:'',loading:'lazy'}));box.appendChild(v)}
    const t=el('div',{class:'tools'});
    const e=el('button',{},'Edit'),d=el('button',{},'Delete');
    e.onclick=()=>startEdit(p.id);d.onclick=()=>{if(confirm('Delete this post?')){posts=posts.filter(x=>x.id!==p.id);save();render()}};
    t.append(e,d);box.appendChild(t);feed.appendChild(box);
  });
}
function startEdit(id){
  const p=posts.find(x=>x.id===id);if(!p)return;editingId=id;
  $('fText').value=p.text||'';$('fImage').value=p.image||'';$('fYoutube').value=p.youtube||'';
  $('editing').textContent='Editing a post. Press Post to save changes.';$('saveBtn').textContent='Save changes';
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearForm(){editingId=null;['fText','fImage','fYoutube'].forEach(i=>$(i).value='');$('editing').textContent='';$('saveBtn').textContent='Post'}
$('saveBtn').onclick=()=>{
  const text=$('fText').value.trim(),image=$('fImage').value.trim(),youtube=$('fYoutube').value.trim();
  if(!text&&!image&&!youtube)return;
  if(editingId){Object.assign(posts.find(x=>x.id===editingId),{text,image,youtube})}
  else posts.push({id:'p'+Date.now(),date:new Date().toISOString(),text,image,youtube});
  save();clearForm();render();
};
$('cancelBtn').onclick=clearForm;
$('exportBtn').onclick=()=>{
  const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(posts,null,2)],{type:'application/json'})),download:'posts.json'});
  a.click();
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{posts=JSON.parse(r.result);save();render()}catch(x){alert('Invalid file')}};r.readAsText(f);
};
load();
</script>
</body></html>
